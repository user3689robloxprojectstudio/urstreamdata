name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project & Copy HTML
      run: |
        cordova create myApp com.urstreamdata.app URSTREAMDATA
        cp index.html myApp/www/index.html
        cd myApp
        cordova platform add android

    - name: Build Debug APK
      run: |
        cd myApp
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: URSTREAMDATA-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk